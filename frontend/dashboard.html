<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAAC - Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topo">
    <div class="marca">
      <div class="icone">🔐</div>
      <div><h1>SAAC</h1><p>Sistema de Achados de Auditoria e Conformidade</p></div>
    </div>
    <nav class="menu" id="menu"></nav>
  </header>

  <main class="conteudo">
    <div class="cabecalho-pagina">
      <div>
        <h2>Dashboard</h2>
        <p id="boas-vindas">Carregando seus dados...</p>
      </div>
      <div class="grupo-botoes">
        <a class="btn btn-principal" href="orgaos.html">Órgãos</a>
        <a class="btn btn-principal" href="achados.html">Achados</a>
      </div>
    </div>

    <div class="alerta" id="alerta-dashboard"></div>
    <div class="vazio" id="carregando-dashboard">Carregando indicadores...</div>

    <div id="painel" style="display:none;">
      <div class="cards-totais" id="cards-totais"></div>
      <div class="grade-2">
        <section class="painel"><h3>Achados por severidade</h3><div id="barras-severidade"></div></section>
        <section class="painel"><h3>Achados por status</h3><div id="barras-status"></div></section>
      </div>
      <section class="painel"><h3>Órgãos com mais achados</h3><div id="barras-orgaos"></div></section>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
