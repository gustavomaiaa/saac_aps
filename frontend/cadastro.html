<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAAC - Cadastro</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="icone">🔐</div>
      <h1>SAAC</h1>
      <p>Sistema de Achados de Auditoria e Conformidade</p>
    </div>
    <h2 class="titulo">Criar nova conta</h2>
    <form id="form-cadastro" novalidate>
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" name="nome" placeholder="Seu nome completo" autocomplete="name" />
      <div class="campo-erro" id="erro-nome"></div>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="seuemail@orgao.gov.br" autocomplete="username" />
      <div class="campo-erro" id="erro-email"></div>
      <label for="area">Área de atuação</label>
      <select id="area" name="area">
        <option value="">Selecione...</option>
        <option>Educação</option>
        <option>Saúde</option>
        <option>Obras</option>
        <option>Finanças</option>
        <option>Administração</option>
        <option>Compliance</option>
        <option>Outra</option>
      </select>
      <div class="campo-erro" id="erro-area"></div>
      <label for="senha">Senha</label>
      <div class="senha-wrapper">
        <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
        <button type="button" class="toggle-senha" id="toggle-senha">Mostrar</button>
      </div>
      <div class="campo-erro" id="erro-senha"></div>
      <button type="submit" class="btn-principal" id="btn-cadastro">Criar conta</button>
      <div class="alerta" id="alerta"></div>
    </form>
    <p class="link-secundario">Já tem uma conta? <a href="login.html">Fazer login</a></p>
  </div>
  <script src="js/config.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
