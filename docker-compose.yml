# Sobe o backend (API em :3000) e o frontend estático (nginx em :8080).
# O Ollama NÃO roda em container: ele roda no host e é acessado via host.docker.internal.
services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      JWT_SECRET: ${JWT_SECRET:-troque_este_segredo_em_producao}
      JWT_EXPIRES_IN: 2h
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-120000}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # necessário no Linux; no Docker Desktop já existe
    volumes:
      - saac-dados:/data
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  saac-dados:
